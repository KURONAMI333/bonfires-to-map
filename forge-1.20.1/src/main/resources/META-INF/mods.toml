modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://x.com/kuronami333"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''${mod_description}'''
authors="${mod_authors}"
logoFile="logo.png"
displayURL="https://www.curseforge.com/minecraft/mc-mods/bonfires-to-map"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Bonfires: 機能の供給源（篝火レジストリとプレイヤー別の発見記録を読む）。
# サーバー側でもデータを読むため side 制約は掛けない（両 dist で required）。
# versionRange は Bonfires の版が複合文字列（例 1.2.20d-1.20.1）のため下限を緩く取る。
[[dependencies.${mod_id}]]
    modId="bonfires"
    mandatory=true
    versionRange="[1.2,)"
    ordering="AFTER"
    side="BOTH"

# JourneyMap: 任意。不在では静かに何もしない（Inner class isolation）。
# JM 自体がクライアント専用 MOD なので宣言も CLIENT に限定。
[[dependencies.${mod_id}]]
    modId="journeymap"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"
