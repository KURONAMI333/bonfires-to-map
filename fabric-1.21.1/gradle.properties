# Bonfires to Map - Fabric 1.21.1 build
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# ─── Minecraft / Fabric ─────────────────────────────────────────
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
# Bonfires 1.2.20c (1.21.1) が fabricloader >=0.16.10 を要求する
loader_version=0.16.14
fabric_version=0.116.11+1.21.1

# ─── Mod metadata ──────────────────────────────────────────────
mod_id=bonfirestomap
mod_name=Bonfires to Map
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.kuronami.bonfirestomap
mod_authors=KURONAMI
mod_description=Shows the Bonfires you have discovered as JourneyMap waypoints (Fabric 1.21.1).

# ─── Required / Optional dependencies ─────────────────────────
# Bonfires（篝火データの供給源。公開 API wehavecookies56.bonfires.* のみ使用）
bonfires_version=1.2.20c-1.21.1-fabric
# JourneyMap Fabric（本体 jar 同梱の journeymap-api-fabric-*.jar を compileOnly で抜き出す）
jm_version=1.21.1-6.0.9+fabric
# owo-lib（Bonfires の必須依存。1.21.1 は >=0.12.15+1.21。dev 実機確認用 runtime のみ）
owo_lib_version=0.12.15.4+1.21
