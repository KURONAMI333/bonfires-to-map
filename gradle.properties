# Gradle / build infra
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Target stack. neoforge.mods.toml refers to these by name through
# generateModMetadata, so removing one breaks the build rather than the mod.
# Values are the verified 1.21.1 matrix from NEW_MOD_GUIDE.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.227
loader_version_range=[1,)

# Mod identity
mod_id=bonfirestomap
mod_name=Bonfires to Map
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.kuronami.bonfirestomap
mod_authors=KURONAMI
mod_description=Shows the Bonfires you have discovered as JourneyMap waypoints.

# ─── Dependencies ─────────────────────────────────────────────
# JourneyMap API (compileOnly・jm.gserv.me 実在確認済み 2026-08-26)
jmap_api_version=2.0.0-1.21.1-SNAPSHOT
# Bonfires (compileOnly・Modrinth maven。Modrinth project amg8VIPH / CF 255347)
bonfires_version=1.2.20b-1.21.1-neoforge
# runClient 用 localRuntime (Modrinth maven・1.21.1 neoforge 実在確認済み)
jm_version=1.21.1-6.0.5+neoforge
